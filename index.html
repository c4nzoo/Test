<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Infotafel">
<meta name="theme-color" content="#0E5A62">
<title>Albert-Schweitzer-Einrichtungen Dinslaken – Infotafel</title>
<style>
:root{--p:#0E5A62;--p2:#093F45;--a:#F2A41F;--o:#E8742A;--bg:#F1F6F5;--tint:#FFF1D2;--card:#fff;--ink:#12303A;--mut:#4A6870}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:1vw;font-size:min(1vw,1.7778vh)}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
body{display:grid;grid-template-rows:9.5rem 1fr 3.2rem;height:100%}
header{background:var(--p);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 3.5rem;border-bottom:.45rem solid var(--a)}
.brand{display:flex;align-items:center;gap:1.6rem}
.brand .logo{width:5.6rem;height:5.6rem;border-radius:50%;background:var(--a);color:var(--p2);display:grid;place-items:center;flex:none}
.brand .logo svg{width:3.6rem;height:3.6rem}
.brand h1{font-size:2.5rem;line-height:1.1;font-weight:800}
.brand p{font-size:1.65rem;color:#CFE7E6;margin-top:.3rem}
.clock{text-align:right}
#time{font-size:4.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#date{font-size:1.7rem;color:#CFE7E6;margin-top:.45rem}
main{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:2.6rem 4rem 1.4rem;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;display:flex;flex-direction:column}
.slide.on{opacity:1;visibility:visible}
.slide h2{font-size:4.2rem;font-weight:800;color:var(--p);line-height:1.1;padding-bottom:1.1rem;position:relative;margin-bottom:1.8rem}
.slide h2::after{content:"";position:absolute;left:0;bottom:0;width:9rem;height:.5rem;border-radius:.3rem;background:var(--a)}
.lead{font-size:2.3rem;line-height:1.4;color:var(--ink);max-width:62rem}
.ic{display:grid;place-items:center;border-radius:50%;background:var(--tint);color:var(--p);flex:none}
.ic svg{width:60%;height:60%}
.body{flex:1;min-height:0;display:flex;gap:3.5rem}
/* split */
.split .left{flex:1.15;display:flex;flex-direction:column;gap:2rem;justify-content:center}
.split .left .ic{width:12rem;height:12rem;background:var(--a);color:var(--p2)}
.split .right{flex:1;display:flex;flex-direction:column;gap:1.4rem;justify-content:center}
.row{display:flex;align-items:center;gap:1.6rem;background:var(--card);border-radius:1.4rem;padding:1.5rem 2rem;border-left:.6rem solid var(--a);box-shadow:0 .2rem .8rem rgba(14,90,98,.12)}
.row .ic{width:5.4rem;height:5.4rem}
.row b{display:block;font-size:2.1rem;color:var(--p)}
.row span{font-size:1.9rem}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.8rem;flex:1;min-height:0}
.tile{background:var(--card);border-radius:1.6rem;padding:1.4rem 1.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7rem;box-shadow:0 .2rem .8rem rgba(14,90,98,.12);border-bottom:.5rem solid var(--a)}
.tile .ic{width:8rem;height:8rem}
.tile b{font-size:2.4rem;color:var(--p);line-height:1.15}
.tile span{font-size:1.6rem;color:var(--mut);line-height:1.3}
/* timeline */
.tl{display:flex;flex-direction:column;gap:1.4rem;flex:1;justify-content:center}
.tl .row{padding:1.4rem 2.2rem}
.tl .t{font-size:2.5rem;font-weight:800;color:var(--p2);background:var(--a);border-radius:1rem;padding:.7rem 1.4rem;min-width:15rem;text-align:center;font-variant-numeric:tabular-nums}
.tl .row span{font-size:2.3rem;flex:1}
/* cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;flex:1;min-height:0;margin-top:1.6rem}
.cards .row{align-items:center}
.cards .row .ic{width:6.6rem;height:6.6rem}
.cards b{font-size:2.3rem}.cards span{font-size:1.85rem;line-height:1.3}
footer{background:var(--p2);position:relative;display:flex;align-items:center;justify-content:center}
#bar{position:absolute;left:0;top:0;height:.45rem;width:0;background:var(--a)}
#dots{display:flex;gap:1rem}
#dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#5E8A90}
#dots i.on{background:var(--a);transform:scale(1.35)}
#pause{position:absolute;left:3.5rem;color:#CFE7E6;font-size:1.3rem;display:none}
#fshint{position:absolute;left:3.5rem;color:#CFE7E6;font-size:1.3rem}
#gear{position:absolute;right:2rem;bottom:.4rem;width:2.4rem;height:2.4rem;border:0;background:none;color:#fff;opacity:.3;cursor:pointer}
#gear:hover,#gear:focus{opacity:1;outline:.15rem solid var(--a)}
#gear svg{width:100%;height:100%}
/* modal */
#modal{position:fixed;inset:0;background:rgba(9,63,69,.82);display:none;z-index:9;align-items:center;justify-content:center}
#modal.on{display:flex}
.box{background:#fff;width:92vw;height:88vh;border-radius:1rem;display:flex;flex-direction:column;font-size:16px;color:var(--ink)}
.box h3{padding:16px 22px;background:var(--p);color:#fff;border-radius:1rem 1rem 0 0;font-size:20px}
.edit{flex:1;overflow:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-content:start}
.fs{border:2px solid #CFE0DE;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#F8FBFA}
.fs label{font-size:13px;font-weight:700;color:var(--p)}
.fs input,.fs textarea{font:inherit;padding:7px 9px;border:1px solid #9DB8B6;border-radius:6px;width:100%}
.fs textarea{resize:vertical}
.fs .hd{font-weight:800;font-size:17px}
.acts{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid #CFE0DE;align-items:center}
.acts button,.acts label.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;border:2px solid var(--p);background:#fff;color:var(--p);cursor:pointer}
.acts button.pri{background:var(--p);color:#fff}
.acts .sp{flex:1}
.hint{font-size:13px;color:var(--mut);padding:0 22px 10px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" id="logo"></div>
    <div><h1>Albert-Schweitzer-Einrichtungen Dinslaken</h1><p>Berufsbildungsbereich (BBB) &amp; Teilhabe</p></div>
  </div>
  <div class="clock"><div id="time">--:--:--</div><div id="date"></div></div>
</header>
<main id="stage"></main>
<footer>
  <div id="bar"></div><div id="pause">⏸ Pause</div><div id="fshint">OK drücken für Vollbild</div><div id="dots"></div>
  <button id="gear" title="Inhalte bearbeiten" aria-label="Inhalte bearbeiten"></button>
</footer>
<div id="modal"><div class="box">
  <h3>Inhalte bearbeiten</h3>
  <div class="hint">Pro Zeile ein Eintrag im Format „Überschrift oder Uhrzeit | Beschreibung“. Die Symbole bleiben in ihrer Reihenfolge erhalten.</div>
  <div class="edit" id="edit"></div>
  <div class="acts">
    <button class="pri" id="save">Speichern</button><button id="cancel">Abbrechen</button>
    <span class="sp"></span>
    <button id="export">Als Datei exportieren</button>
    <label class="btn">Datei importieren<input type="file" id="import" accept=".json,application/json" hidden></label>
    <button id="reset">Zurücksetzen</button>
  </div>
</div></div>

<script>
(function(){
"use strict";
var KEY="ase-bbb-signage-v1";
/* Piktogramme (Inline-SVG, 48x48) */
var I={
heart:'<path d="M24 41S6 30 6 18a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 12-18 23-18 23z"/>',
clock:'<circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 5"/>',
pin:'<path d="M24 44S10 31 10 20a14 14 0 0 1 28 0c0 11-14 24-14 24z"/><circle cx="24" cy="20" r="5"/>',
wood:'<circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="11"/><circle cx="24" cy="24" r="4"/>',
metal:'<circle cx="24" cy="24" r="12"/><circle cx="24" cy="24" r="5"/><path d="M24 4v7M24 37v7M4 24h7M37 24h7M10 10l5 5M33 33l5 5M38 10l-5 5M15 33l-5 5"/>',
kitchen:'<path d="M15 32v-5a7 7 0 0 1 2-13 8 8 0 0 1 14 0 7 7 0 0 1 2 13v5z"/><path d="M15 39h18"/>',
garden:'<path d="M24 43V23"/><path d="M24 27C24 17 16 12 7 12c0 9 6 15 17 15z"/><path d="M24 23c0-8 6-12 15-12 0 8-5 12-15 12z"/>',
box:'<path d="M6 14 24 6l18 8v20l-18 8-18-8z"/><path d="M6 14l18 8 18-8M24 22v20"/>',
truck:'<path d="M4 11h24v23H4zM28 19h9l7 8v7H28z"/><circle cx="13" cy="36" r="4"/><circle cx="36" cy="36" r="4"/>',
laptop:'<rect x="8" y="10" width="32" height="22" rx="2"/><path d="M3 39h42"/>',
coffee:'<path d="M7 18h26v10a10 10 0 0 1-10 10h-6A10 10 0 0 1 7 28z"/><path d="M33 21h4a5 5 0 0 1 0 10h-4M15 6v6M23 6v6"/>',
plate:'<circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="9"/>',
phone:'<path d="M12 6h8l3 10-5 3a24 24 0 0 0 11 11l3-5 10 3v8a4 4 0 0 1-4 4A34 34 0 0 1 8 10a4 4 0 0 1 4-4z"/>',
cal:'<rect x="6" y="9" width="36" height="33" rx="3"/><path d="M6 19h36M15 4v8M33 4v8"/>',
people:'<circle cx="18" cy="16" r="6"/><circle cx="34" cy="19" r="5"/><path d="M5 40a13 13 0 0 1 26 0M32 29a9 9 0 0 1 13 10"/>',
school:'<path d="M3 18 24 8l21 10-21 10z"/><path d="M11 23v10c7 6 19 6 26 0V23"/>',
sun:'<circle cx="24" cy="24" r="8"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M38 10l-4 4M14 34l-4 4"/>'
};
function svg(k){return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[k]||I.heart)+'</svg>';}
var GEAR='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="7"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M38 10l-4 4M14 34l-4 4"/></svg>';

var DEFAULT={slides:[
{type:"split",title:"Herzlich willkommen in Dinslaken!",icon:"heart",dur:12,
 lead:"„Ehrfurcht vor dem Leben“ – Albert Schweitzers Leitsatz begleitet uns jeden Tag. Schön, dass Sie da sind! Bitte melden Sie sich direkt hier vor Ort an.",
 items:[{k:"Mo – Do",v:"07:30 – 16:00 Uhr",i:"clock"},{k:"Freitag",v:"07:30 – 13:30 Uhr",i:"clock"},{k:"Anmeldung",v:"Direkt am Empfang, Erdgeschoss",i:"pin"}]},
{type:"grid",title:"Dein Weg im Berufsbildungsbereich (BBB)",dur:12,lead:"",
 items:[{k:"Holzbearbeitung",v:"Sägen, Schleifen, Bauen",i:"wood"},{k:"Metalltechnik",v:"Messen, Bohren, Fügen",i:"metal"},{k:"Hauswirtschaft & Küche",v:"Kochen, Backen, Service",i:"kitchen"},{k:"Garten- & Landschaftsbau",v:"Pflanzen, Pflegen, Gestalten",i:"garden"},{k:"Montage & Verpackung",v:"Sorgfältig zusammenbauen",i:"box"},{k:"Lager & Logistik",v:"Ordnen, Zählen, Versenden",i:"truck"}]},
{type:"timeline",title:"Aktuelle Angebote & Termine heute",dur:12,lead:"",
 items:[{k:"08:30 Uhr",v:"Morgenrunde & Tagesstart",i:"people"},{k:"10:00 Uhr",v:"Bewerbungstraining & EDV-Grundlagen (Raum 12)",i:"laptop"},{k:"13:15 Uhr",v:"Praktische Werkstatt-Einführung Holz & Metall",i:"wood"},{k:"15:00 Uhr",v:"Abschlussrunde & Ausblick auf morgen",i:"cal"}]},
{type:"cards",title:"Pausen & Mittagsangebot",dur:12,lead:"Gemeinsam Kraft tanken – frisch zubereitet in unserer hauseigenen Küche.",
 items:[{k:"09:30 – 09:45 Uhr",v:"Frühstückspause",i:"coffee"},{k:"12:00 – 12:45 Uhr",v:"Mittagspause",i:"plate"},{k:"Tagesgericht (Beispiel)",v:"Gemüselasagne mit buntem Salat",i:"kitchen"},{k:"Gut zu wissen",v:"Essenswünsche bitte bis 09:00 Uhr melden",i:"people"}]},
{type:"cards",title:"Interesse an einem Praktikum oder dem BBB?",dur:12,lead:"Für Interessierte, Eltern und Schulen: Wir freuen uns auf Ihren Besuch.",
 items:[{k:"Schnuppertag",v:"Unverbindlich vorbeikommen und mitmachen",i:"cal"},{k:"Beratungsgespräch",v:"Persönlich, individuell, vertraulich",i:"school"},{k:"Telefon",v:"02064 / 000 000 (Platzhalter)",i:"phone"},{k:"Raum",v:"Raum 00, Erdgeschoss (Platzhalter)",i:"pin"}]}
]};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function valid(d){return d&&Array.isArray(d.slides)&&d.slides.length>0&&d.slides.every(function(s){return s&&typeof s.title==="string"&&Array.isArray(s.items);});}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(valid(d))return d;}catch(e){}return clone(DEFAULT);}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var S=load(),cur=0,elapsed=0,paused=false,last=null;
var stage=document.getElementById("stage"),dots=document.getElementById("dots"),bar=document.getElementById("bar");
document.getElementById("logo").innerHTML=svg("heart");
document.getElementById("gear").innerHTML=GEAR;

function slideHTML(s){
  var h='<h2>'+esc(s.title)+'</h2>',it=s.items||[],b='';
  if(s.type==="split"){
    b='<div class="body split"><div class="left"><div class="ic">'+svg(s.icon||"heart")+'</div><p class="lead">'+esc(s.lead)+'</p></div><div class="right">'+
      it.map(function(x){return '<div class="row"><div class="ic">'+svg(x.i)+'</div><div><b>'+esc(x.k)+'</b><span>'+esc(x.v)+'</span></div></div>';}).join("")+'</div></div>';
  }else if(s.type==="grid"){
    b='<div class="grid">'+it.map(function(x){return '<div class="tile"><div class="ic">'+svg(x.i)+'</div><b>'+esc(x.k)+'</b><span>'+esc(x.v)+'</span></div>';}).join("")+'</div>';
  }else if(s.type==="timeline"){
    b='<div class="tl">'+it.map(function(x){return '<div class="row"><div class="t">'+esc(x.k)+'</div><div class="ic">'+svg(x.i)+'</div><span>'+esc(x.v)+'</span></div>';}).join("")+'</div>';
  }else{
    b=(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+'<div class="cards">'+it.map(function(x){return '<div class="row"><div class="ic">'+svg(x.i)+'</div><div><b>'+esc(x.k)+'</b><span>'+esc(x.v)+'</span></div></div>';}).join("")+'</div>';
  }
  return h+b;
}
function build(){
  stage.innerHTML="";dots.innerHTML="";
  S.slides.forEach(function(s){
    var d=document.createElement("section");d.className="slide";d.innerHTML=slideHTML(s);stage.appendChild(d);
    dots.appendChild(document.createElement("i"));
  });
  if(cur>=S.slides.length)cur=0;
  show(cur);
}
function show(n){
  var L=S.slides.length;cur=(n+L)%L;elapsed=0;
  Array.prototype.forEach.call(stage.children,function(e,i){e.classList.toggle("on",i===cur);});
  Array.prototype.forEach.call(dots.children,function(e,i){e.classList.toggle("on",i===cur);});
}
function frame(now){
  if(last===null)last=now;
  var dt=now-last;last=now;
  if(!paused&&!modal.classList.contains("on")){elapsed+=dt;}
  var d=Math.max(3,Number(S.slides[cur].dur)||12)*1000;
  bar.style.width=Math.min(100,elapsed/d*100)+"%";
  if(elapsed>=d&&!paused)show(cur+1);
  requestAnimationFrame(frame);
}

/* Uhr & Datum (ohne Intl, damit es offline auf jedem TV deutsch bleibt) */
var WT=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MO=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function p2(n){return n<10?"0"+n:""+n;}
function tick(){var d=new Date();
  document.getElementById("time").textContent=p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());
  document.getElementById("date").textContent=WT[d.getDay()]+", "+d.getDate()+". "+MO[d.getMonth()]+" "+d.getFullYear();}
tick();setInterval(tick,1000);

/* Bedienung */
var modal=document.getElementById("modal");
function setPause(p){paused=p;document.getElementById("pause").style.display=p?"block":"none";}
/* Vollbild & Größe an den sichtbaren Bereich anpassen */
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function goFS(){var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;
  if(f&&!isFS()){try{var r=f.call(d);if(r&&r.catch)r.catch(function(){});}catch(x){}}}
function fit(){var w=window.innerWidth,h=window.innerHeight;
  document.documentElement.style.fontSize=Math.min(w/100,h*1.7778/100)+"px";
  document.body.style.height=h+"px";
  document.getElementById("fshint").style.display=isFS()?"none":"block";}
fit();window.addEventListener("resize",fit);
document.addEventListener("fullscreenchange",fit);document.addEventListener("webkitfullscreenchange",fit);
document.addEventListener("click",function(){if(!modal.classList.contains("on"))goFS();});
document.addEventListener("keydown",function(e){
  if(modal.classList.contains("on")){if(e.key==="Escape")closeM();return;}
  if(!isFS()&&(e.key==="Enter"||e.key===" ")){e.preventDefault();goFS();return;}
  if(e.key==="ArrowRight"){show(cur+1);}
  else if(e.key==="ArrowLeft"){show(cur-1);}
  else if(e.key===" "||e.key==="Enter"&&document.activeElement===document.body){e.preventDefault();setPause(!paused);}
});

/* Bearbeiten */
var edit=document.getElementById("edit");
function openM(){
  edit.innerHTML=S.slides.map(function(s,n){
    return '<div class="fs" data-n="'+n+'"><div class="hd">Folie '+(n+1)+'</div>'+
    '<label>Titel</label><input class="f-title" value="'+esc(s.title)+'">'+
    '<label>Einleitungstext (falls vorhanden)</label><textarea class="f-lead" rows="3">'+esc(s.lead||"")+'</textarea>'+
    '<label>Einträge (eine Zeile je Eintrag: Titel/Uhrzeit | Beschreibung)</label><textarea class="f-items" rows="7">'+
    esc((s.items||[]).map(function(x){return x.k+" | "+x.v;}).join("\n"))+'</textarea>'+
    '<label>Anzeigedauer in Sekunden</label><input class="f-dur" type="number" min="3" max="120" value="'+esc(s.dur||12)+'"></div>';
  }).join("");
  modal.classList.add("on");
}
function closeM(){modal.classList.remove("on");}
document.getElementById("gear").onclick=openM;
document.getElementById("cancel").onclick=closeM;
document.getElementById("save").onclick=function(){
  Array.prototype.forEach.call(edit.querySelectorAll(".fs"),function(f){
    var s=S.slides[+f.getAttribute("data-n")],old=s.items||[];
    s.title=f.querySelector(".f-title").value.trim()||s.title;
    s.lead=f.querySelector(".f-lead").value.trim();
    s.dur=Math.min(120,Math.max(3,parseInt(f.querySelector(".f-dur").value,10)||12));
    var ls=f.querySelector(".f-items").value.split("\n").filter(function(l){return l.trim();});
    s.items=ls.map(function(l,i){var p=l.split("|");var k=p.shift().trim();
      return{k:k,v:p.join("|").trim(),i:(old[i]&&old[i].i)||(old[old.length-1]&&old[old.length-1].i)||"heart"};});
  });
  store();closeM();build();
};
document.getElementById("reset").onclick=function(){
  if(confirm("Alle Änderungen verwerfen und die Beispielinhalte wiederherstellen?")){S=clone(DEFAULT);try{localStorage.removeItem(KEY);}catch(e){}closeM();build();}
};
document.getElementById("export").onclick=function(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download="infotafel-inhalte.json";document.body.appendChild(a);a.click();a.remove();
};
document.getElementById("import").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!valid(d))throw 0;S=d;store();closeM();build();}catch(x){alert("Die Datei konnte nicht gelesen werden. Bitte eine zuvor exportierte Datei verwenden.");}};
  r.readAsText(f);e.target.value="";
};
var hide;document.addEventListener("mousemove",function(){document.body.style.cursor="";clearTimeout(hide);hide=setTimeout(function(){document.body.style.cursor="none";},4000);});

build();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
